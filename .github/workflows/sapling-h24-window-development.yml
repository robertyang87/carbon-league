name: Sapling H24 window three-arm original development
on: workflow_dispatch
permissions:
  contents: read
  actions: read
concurrency:
  group: sapling-h24-window-354-355
  cancel-in-progress: false
env:
  CARGO: reports/sapling_1200k/master6_actor_dev/cargo_tree_action_learning_dev
  LANE: reports/sapling_1200k/master6_actor_dev/cargo_tree_action_learning_dev/territory_sequence/windowed/fresh_original
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  gate:
    if: github.ref == 'refs/heads/main' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      play: ${{ steps.prior.outputs.play }}
      receipt: ${{ steps.prior.outputs.receipt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /code/env_src/carbon_challenge-master/zerosum_env/
            /data/master3s2_source.py
            /sources/master3s2/master3s2.py
            /reports/agent-guide.md
            /reports/sapling_1200k/master6_actor_dev/cargo_tree_action_learning_dev/candidate.py
            /reports/sapling_1200k/master6_actor_dev/cargo_tree_action_learning_dev/candidate.npz
            /reports/sapling_1200k/master6_actor_dev/cargo_tree_action_learning_dev/direct_original/games/candidate/raw_621758346_1.json.gz
            /reports/sapling_1200k/master6_actor_dev/cargo_tree_action_learning_dev/ladder_live/
            /reports/sapling_1200k/master6_actor_dev/cargo_tree_action_learning_dev/territory_sequence/candidate.py
            /reports/sapling_1200k/master6_actor_dev/cargo_tree_action_learning_dev/territory_sequence/candidate.npz
            /reports/sapling_1200k/master6_actor_dev/cargo_tree_action_learning_dev/territory_sequence/response/
            /reports/sapling_1200k/master6_actor_dev/cargo_tree_action_learning_dev/territory_sequence/ladder_timing/summary.json
            /reports/sapling_1200k/master6_actor_dev/cargo_tree_action_learning_dev/territory_sequence/ladder_timing/live_rules.json
            /reports/sapling_1200k/master6_actor_dev/cargo_tree_action_learning_dev/territory_sequence/fresh_original/
            /reports/sapling_1200k/master6_actor_dev/cargo_tree_action_learning_dev/territory_sequence/windowed/
      - name: Verify registration and install official host dependencies
        run: |
          set -euo pipefail
          echo "b1e3373e124fed8db43f0ebb34d89f52257468e6c6bdad7fe918741b409c21d7  $LANE/protocol.json" | sha256sum --check
          python3.12 -m venv "$RUNNER_TEMP/carbon-env"
          "$RUNNER_TEMP/carbon-env/bin/python" -m pip install --only-binary=:all: --disable-pip-version-check --index-url https://pypi.org/simple numpy==1.26.4 requests==2.32.5 jsonschema==4.25.1
          echo "$RUNNER_TEMP/carbon-env/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/carbon-env/bin/python" "$LANE/matrix.py" check
      - name: Recompute prior official outcomes and activation
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=44594279145
          metadata=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '[.status,.head_sha,.path]|join(" ")')
          test "$metadata" = "completed f82b98f91dbb6ca02f18f4aee5597cecd0bf06d5 .github/workflows/sapling-h24-development.yml"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --pattern "h24-*-$run_id" --dir "$RUNNER_TEMP/prior"
          python "$LANE/matrix.py" activate --prior-artifacts "$RUNNER_TEMP/prior" --activation-receipt "$RUNNER_TEMP/activation.json"
          echo "receipt=$(jq -c . "$RUNNER_TEMP/activation.json")" >> "$GITHUB_OUTPUT"

  session:
    needs: gate
    if: needs.gate.outputs.play == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        seed: [621758354, 621758355]
        seat: [0, 1]
    name: window-${{ matrix.seed }}-${{ matrix.seat }}
    timeout-minutes: 100
    env:
      SEED: ${{ matrix.seed }}
      SEAT: ${{ matrix.seat }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /code/env_src/carbon_challenge-master/zerosum_env/
            /data/master3s2_source.py
            /sources/master3s2/master3s2.py
            /reports/agent-guide.md
            /reports/sapling_1200k/master6_actor_dev/cargo_tree_action_learning_dev/candidate.py
            /reports/sapling_1200k/master6_actor_dev/cargo_tree_action_learning_dev/candidate.npz
            /reports/sapling_1200k/master6_actor_dev/cargo_tree_action_learning_dev/direct_original/games/candidate/raw_621758346_1.json.gz
            /reports/sapling_1200k/master6_actor_dev/cargo_tree_action_learning_dev/ladder_live/
            /reports/sapling_1200k/master6_actor_dev/cargo_tree_action_learning_dev/territory_sequence/candidate.py
            /reports/sapling_1200k/master6_actor_dev/cargo_tree_action_learning_dev/territory_sequence/candidate.npz
            /reports/sapling_1200k/master6_actor_dev/cargo_tree_action_learning_dev/territory_sequence/response/
            /reports/sapling_1200k/master6_actor_dev/cargo_tree_action_learning_dev/territory_sequence/ladder_timing/summary.json
            /reports/sapling_1200k/master6_actor_dev/cargo_tree_action_learning_dev/territory_sequence/ladder_timing/live_rules.json
            /reports/sapling_1200k/master6_actor_dev/cargo_tree_action_learning_dev/territory_sequence/fresh_original/
            /reports/sapling_1200k/master6_actor_dev/cargo_tree_action_learning_dev/territory_sequence/windowed/
      - name: Verify registration and install official host dependencies
        run: |
          set -euo pipefail
          echo "b1e3373e124fed8db43f0ebb34d89f52257468e6c6bdad7fe918741b409c21d7  $LANE/protocol.json" | sha256sum --check
          python3.12 -m venv "$RUNNER_TEMP/carbon-env"
          "$RUNNER_TEMP/carbon-env/bin/python" -m pip install --only-binary=:all: --disable-pip-version-check --index-url https://pypi.org/simple numpy==1.26.4 requests==2.32.5 jsonschema==4.25.1
          echo "$RUNNER_TEMP/carbon-env/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/carbon-env/bin/python" "$LANE/matrix.py" check
      - name: Check earlier attempts on the same map and seat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3.12 - <<'PY'
          import json, os, urllib.request
          api = os.environ['GITHUB_API_URL'] + '/repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/'
          def pages(path, key):
              for page in range(1, 101):
                  url = api + path + f'?per_page=100&page={page}'
                  req = urllib.request.Request(url, headers={'Authorization':'Bearer ' + os.environ['GH_TOKEN']})
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      rows = json.load(resp)[key]
                  yield from rows
                  if len(rows) < 100:
                      return
              raise RuntimeError('Incomplete run history')
          current = int(os.environ['GITHUB_RUN_ID'])
          name = 'window-' + os.environ['SEED'] + '-' + os.environ['SEAT']
          for run in pages('workflows/sapling-h24-window-development.yml/runs', 'workflow_runs'):
              if run['id'] >= current or run['head_branch'] != 'main':
                  continue
              for job in pages(f"runs/{run['id']}/jobs", 'jobs'):
                  if job['name'] == name and any(s['name'] == 'Play three registered arms' and s.get('started_at')
                      and s['conclusion'] != 'skipped' for s in job.get('steps', [])):
                      raise SystemExit(f"{name} already entered the match step in run {run['id']}")
          PY

      - name: Build locked isolated runtime
        timeout-minutes: 17
        run: |
          set -euo pipefail
          ctx="$RUNNER_TEMP/image-context"
          mkdir -p "$ctx/code/env_src/carbon_challenge-master"
          cp -r code/env_src/carbon_challenge-master/zerosum_env "$ctx/code/env_src/carbon_challenge-master/"
          sed 's|^FROM python:3.12-slim$|FROM python@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b|' "$CARGO/ladder_live/Dockerfile" > "$ctx/Dockerfile"
          docker build --tag sapling-window:registered "$ctx"

      - name: Play three registered arms
        timeout-minutes: 78
        env:
          ACTIVATION: ${{ needs.gate.outputs.receipt }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/receipts"
          mkdir -p "$out"
          printf '%s\n' "$ACTIVATION" > "$out/activation.json"
          python "$LANE/matrix.py" play --seed "$SEED" --seat "$SEAT" --out "$out" --activation-receipt "$out/activation.json"

      - name: Replay each registered arm
        if: always()
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/receipts"
          python "$LANE/matrix.py" verify --seed "$SEED" --seat "$SEAT" --out "$RUNNER_TEMP/receipts" | tee "$RUNNER_TEMP/receipts/verification.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: h24-window-${{ matrix.seed }}-${{ matrix.seat }}-${{ github.run_id }}
          path: ${{ runner.temp }}/receipts/
          if-no-files-found: warn
