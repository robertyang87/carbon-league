name: Sapling belief fixed replay timing
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Frozen candidate (older variants have archived results)'
        required: true
        type: choice
        default: '6c548995'
        options:
          - '6c548995'
          - '61dae172'
          - 'bc69b55e'

permissions:
  contents: read
  actions: read

concurrency:
  group: sapling-belief-${{ inputs.variant }}-621471120
  cancel-in-progress: false

jobs:
  timing:
    if: github.ref == 'refs/heads/main' && github.run_attempt == '1' && inputs.variant == '6c548995'
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      VARIANT: ${{ inputs.variant }}
      REGISTRATION_SHA: c997aabef84fd387e6c9dd81a877b9b11a34e5d6351c1e5fcde9a2b5751006c4
      CARGO: reports/sapling_1200k/master6_actor_dev/cargo_tree_action_learning_dev
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /code/env_src/carbon_challenge-master/zerosum_env/
            /reports/agent-guide.md
            /reports/sapling_1200k/master6_actor_dev/tree_response_training/source/raw_621471120_0.json.gz
            /reports/sapling_1200k/master6_actor_dev/cargo_tree_action_learning_dev/ladder_live/
            /reports/sapling_1200k/master6_actor_dev/cargo_tree_action_learning_dev/direct_original/games/candidate/raw_621758346_1.json.gz
            /reports/sapling_1200k/master6_actor_dev/cargo_tree_action_learning_dev/native_actor_corpus/full.py
            /reports/sapling_1200k/master6_actor_dev/cargo_tree_action_learning_dev/native_actor_corpus/fit.json
            /reports/sapling_1200k/master6_actor_dev/cargo_tree_action_learning_dev/native_actor_corpus/ladder_timing/
            /reports/sapling_1200k/master6_actor_dev/cargo_tree_action_learning_dev/learned_carbon_observation/ladder_timing/time_replay.py

      - name: Check earlier execution of this frozen registration
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3.12 - <<'PY'
          import json, os, urllib.request
          base=os.environ["GITHUB_API_URL"]+"/repos/"+os.environ["GITHUB_REPOSITORY"]+"/actions/"
          def pages(path,key):
              for page in range(1,101):
                  url=base+path+f"?per_page=100&page={page}"
                  with urllib.request.urlopen(urllib.request.Request(url,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"]}),timeout=15) as r:
                      items=json.load(r)[key]
                  yield from items
                  if len(items)<100:return
              raise ValueError("Actions history incomplete")
          for r in pages("workflows/sapling-belief-timing.yml/runs","workflow_runs"):
              if str(r["id"])==os.environ["GITHUB_RUN_ID"] or r["head_branch"]!="main":continue
              for j in pages(f"runs/{r['id']}/jobs","jobs"):
                  if any(s["name"]==f"Measure {os.environ['VARIANT']} on the registered public replay" and s.get("started_at") and s.get("conclusion")!="skipped" for s in j.get("steps",[])):
                      raise SystemExit(f"Timing already attempted in run {r['id']}")
          PY

      - name: Verify the frozen replay and host interpreter
        timeout-minutes: 4
        run: |
          set -euo pipefail
          lane="$CARGO/native_actor_corpus/ladder_timing"
          echo "LANE=$lane" >> "$GITHUB_ENV"
          python3.12 -m venv "$RUNNER_TEMP/carbon-env"
          "$RUNNER_TEMP/carbon-env/bin/python" -m pip install --only-binary=:all: --disable-pip-version-check --index-url https://pypi.org/simple numpy==1.26.4 requests==2.32.5 jsonschema==4.25.1
          echo "$RUNNER_TEMP/carbon-env/bin" >> "$GITHUB_PATH"
          echo "$REGISTRATION_SHA  $lane/protocol.json" | sha256sum --check
          "$RUNNER_TEMP/carbon-env/bin/python" "$lane/variant.py" --registration-sha "$REGISTRATION_SHA" --check

      - name: Build frozen CPU image
        timeout-minutes: 14
        run: |
          set -euo pipefail
          ctx="$RUNNER_TEMP/belief-image"
          mkdir -p "$ctx/code/env_src/carbon_challenge-master"
          cp -r code/env_src/carbon_challenge-master/zerosum_env "$ctx/code/env_src/carbon_challenge-master/"
          sed 's|^FROM python:3.12-slim$|FROM python@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b|' "$CARGO/ladder_live/Dockerfile" > "$ctx/Dockerfile"
          docker build --tag "sapling-belief:$VARIANT" "$ctx"

      - name: Measure ${{ inputs.variant }} on the registered public replay
        timeout-minutes: 12
        run: |
          python "$LANE/variant.py" --registration-sha "$REGISTRATION_SHA" --image "sapling-belief:$VARIANT" --out "$RUNNER_TEMP/belief-receipts"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sapling-belief-${{ inputs.variant }}-${{ github.run_id }}
          path: ${{ runner.temp }}/belief-receipts/
          if-no-files-found: warn
