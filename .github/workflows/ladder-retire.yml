name: ladder-retire

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cnet2-search-v12

      - name: Login (CSRF primed) and retire 5 in one process
        env:
          LADDER_BASE: https://117.72.210.134
          LADDER_PASS: ${{ secrets.LADDER_PASS }}
          LADDER_COOKIES: /tmp/ladder_cookies.json
        run: |
          python3 - <<'PYEOF'
          import sys
          sys.path.insert(0, "code")
          import ladder
          ladder.cmd_login("claude-opus55-cloud")
          ladder.session()
          IDS = ["9439051a4915cf1eab1fa9a604ce7707",
                 "072688045615bc3e0f9c59bcccba7218",
                 "eeefd6e19021355633d34f6d5a2a1a9b",
                 "64241d10fefabe20d2123b45cbc217d2",
                 "6142a1f80ca7fede3e81608eed8716ab"]
          for sid in IDS:
              try:
                  ladder.cmd_retire(sid, "yes")
                  print("RETIRED_OK", sid, flush=True)
              except SystemExit as e:
                  print("RETIRED_FAIL", sid, e, flush=True)
              except Exception as e:
                  print("RETIRED_FAIL", sid, repr(e), flush=True)
          print("--- MINE AFTER ---")
          ladder.cmd_mine()
          PYEOF
