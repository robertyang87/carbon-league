name: ladder-replay-pull

on:
  workflow_dispatch:
    inputs:
      strategy_id:
        description: "Strategy id on the ladder"
        required: true
        default: "d679ed45ab595e8b7bb1ea51c3451154"
      label:
        description: "Label for commit messages"
        required: true
        default: "Master3s2"
      outdir:
        description: "Corpus directory to fill (relative to repo root)"
        required: true
        default: "data/m3s2_corpus"

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Ping ladder
        env:
          LADDER_BASE: https://117.72.210.134
        run: python3 code/ladder.py ping

      - name: Login, list matches, pull replays
        env:
          LADDER_BASE: https://117.72.210.134
          LADDER_PASS: ${{ secrets.LADDER_PASS }}
          LADDER_COOKIES: /tmp/ladder_cookies.json
          # P2-5 fix (Codex review 20261114): inputs go through env, never
          # interpolated into the shell script itself -- direct interpolation
          # lets anyone with dispatch permission inject extra shell commands
          # through a crafted input value (same pattern as the
          # cloud-assistant P3 fix).
          LADDER_STRATEGY_ID: ${{ inputs.strategy_id }}
          LADDER_OUTDIR: ${{ inputs.outdir }}
        run: |
          python3 code/ladder.py login claude-opus55-cloud
          python3 code/ladder.py matches "$LADDER_STRATEGY_ID"
          python3 code/ladder.py replays "matches_${LADDER_STRATEGY_ID}.json" "$LADDER_OUTDIR"

      - name: Commit corpus
        env:
          # P2-5 fix (Codex review 20261114): inputs via env, as above.
          LADDER_LABEL: ${{ inputs.label }}
          LADDER_OUTDIR: ${{ inputs.outdir }}
        run: |
          git config user.name "carbon-ci"
          git config user.email "ci@users.noreply.github.com"
          git add "$LADDER_OUTDIR"
          echo "corpus files: $(ls "$LADDER_OUTDIR" | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          if git diff --cached --quiet; then
            echo "no new replays"
          else
            git commit -m "data: pull ${LADDER_LABEL} replays via ladder API into ${LADDER_OUTDIR}"
            ok=0
            for i in 1 2 3; do
              if git pull --rebase origin main && git push; then ok=1; break; fi
              sleep 10
            done
            [ "$ok" = 1 ] || { echo "push failed after 3 attempts"; exit 1; }
          fi
