name: ecs-release

on:
  workflow_dispatch:
    inputs:
      instance_id:
        description: "ECS instance id to release"
        required: true
      region:
        description: "Region id"
        required: true
        default: "cn-shanghai"
      expected_ip:
        description: "Expected public IP (pre-check must match or nothing is deleted)"
        required: true
      marker:
        description: "Unique marker printed in the run output"
        required: true

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Release ECS instance via ECS API
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          ACS_REGION: ${{ inputs.region }}
          # P2-5 fix (Codex review 20261114): inputs go through env, never
          # interpolated into the shell script itself -- direct interpolation
          # lets anyone with dispatch permission inject extra shell commands
          # through a crafted input value (same pattern as the
          # cloud-assistant P3 fix).
          ECS_INSTANCE_ID: ${{ inputs.instance_id }}
          ECS_EXPECTED_IP: ${{ inputs.expected_ip }}
          ECS_MARKER: ${{ inputs.marker }}
        run: |
          python3 tools/ecs_release.py "$ECS_INSTANCE_ID" "$ECS_EXPECTED_IP" "$ECS_MARKER"
